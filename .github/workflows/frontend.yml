name: Frontend quality checks

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Regenerate lockfile with compatible dependency updates
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Apply non-breaking dependency security updates
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Install frontend dependencies from lockfile
        run: npm ci --legacy-peer-deps
      - name: Verify React Router dependency
        run: node -e "console.log(require.resolve('react-router-dom'))"
      - name: Run frontend authentication tests
        run: npm test
      - name: Build production frontend
        if: always()
        run: npm run build
      - name: Audit frontend dependencies
        if: always()
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const v=a.metadata?.vulnerabilities||{}; console.log(JSON.stringify(v)); if ((v.high||0)+(v.critical||0)>0) process.exit(1)"
      - name: Upload frontend dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit
          path: |
            client/npm-audit.json
            client/package-lock.json
          if-no-files-found: ignore
      - name: Commit regenerated frontend lockfile after successful validation
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- client/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/package-lock.json
            git commit -m "chore(deps): refresh frontend lockfile"
            git push
          fi
